[package]
name = "solana-compressed-accounts"
version.workspace = true
edition.workspace = true
description = "ZeroClaw tool plugin: read ZK compressed accounts and verify their merkle proofs rather than trusting the indexer."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
solana-plugin-core = { path = "../solana-plugin-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = "0.46"
waki = "0.5"
