name = "daybook-shop"
version = "0.1.0"
description = "Quote catalog items, confirm payment against the chain, and close the day's book."
wasm_path = "daybook-shop.wasm"
capabilities = ["tool"]

# http_client is needed by the check action, which reads the chain to see
# whether a payment arrived. The quote action never makes a request; the
# permission is held by the component because settlement and quoting must
# share one append-only log, and splitting them would put that log on the
# wire where a manipulated model could rewrite it.
permissions = ["http_client", "config_read"]
