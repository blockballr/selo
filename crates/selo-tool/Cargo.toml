[package]
name = "selo-tool"
version.workspace = true
edition.workspace = true
description = "ZeroClaw tool plugin for daybook: quote catalog items, confirm on-chain payment, and close the day."

[[bin]]
name = "selo-tool"
path = "src/main.rs"

[dependencies]
selo-core = { path = "../selo-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.0", features = ["json"] }
sha2 = "0.10"
bs58 = "0.5"