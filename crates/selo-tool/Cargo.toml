[package]
name = "selo-tool"
version.workspace = true
edition.workspace = true
description = "Zeroclaw deterministic command-line tool for performing accounting work"

[[bin]]
name = "selo-tool"
path = "src/main.rs"

[dependencies]
selo-core = { path = "../selo-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.0", features = ["json"] }
sha2 = "0.10"
bs58 = "0.5"
dotenvy = "0.15"
clap = { version = "4.4", features = ["derive", "env"] }
qrcode = "0.14.1"