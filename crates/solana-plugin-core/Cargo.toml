[package]
name = "solana-plugin-core"
version.workspace = true
edition.workspace = true
description = "Pure Solana JSON-RPC logic shared by the ZeroClaw plugin suite. No I/O, natively testable."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
base64 = "0.22"
ed25519-dalek = "2"
sha2 = "0.10"
curve25519-dalek = "4"
light-poseidon = "0.4"
ark-bn254 = "0.5"

[dev-dependencies]
base64 = "0.22"
ed25519-dalek = "2"
bs58 = "0.5"
