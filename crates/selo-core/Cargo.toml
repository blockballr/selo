[package]
name = "selo-core"
version.workspace = true
edition.workspace = true
description = "Selo's core money path: quoting, settlement, ledger, period close and cost basis. No I/O, natively testable."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
base64 = "0.22"
ed25519-dalek = "2"
sha2 = "0.10"
curve25519-dalek = "4"
light-poseidon = "0.4.0"
ark-bn254 = "0.5.0"
ark-ec = "0.5.0"
ark-ff = "0.5.0"
ark-groth16 = "0.5.0"
ark-crypto-primitives = "0.5.0"
ark-relations = "0.5.0"
ark-serialize = "0.5.0"
ark-std = "0.5.0"
ark-r1cs-std = "0.5.0"
bincode = "1.3"
hex = "0.4.3"

[dev-dependencies]
bs58 = "0.5"