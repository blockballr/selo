[package]
name = "selo-core"
version.workspace = true
edition.workspace = true
description = "Selo's core money path: quoting, settlement, ledger, period close and cost basis. No I/O, natively testable."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
base64 = "0.22"
ed25519-dalek = "2"
sha2 = "0.10"
curve25519-dalek = "4"
ureq = { version = "3.3.0", features = ["json"] }

[dev-dependencies]
bs58 = "0.5"
