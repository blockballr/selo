name = "selo"
description = "Pure-Rust cryptographic accounting, Solana Pay QR invoicing, ZK audit state root verification, and daily close anchoring."
version = "0.1.0"
binary = "target/release/selo-tool"

[commands]
issue = "Issue a Solana Pay payment intent quote with a single-use reference key and embedded amount tag."
confirm = "Scan the cluster for on-chain settlements matching stored reference keys."
check = "Inspect local store status: total, pending, settled, and expired quotes."
close = "Build and anchor a deterministic daily trading close with a Poseidon BN254 Merkle commitment."
ingest = "Ingest transaction history, parse net balance deltas, classify counterparties, and record FIFO tax lots."
verify = "Verify the local tax ledger state root against a published Poseidon BN254 commitment."
dispatch = "Route a natural-language prompt to the matching selo-tool subcommand. Used by the WhatsApp webhook bridge."

# Scheduling is owned by the Telegram adapter (adapters/telegram/main.py),
# not by the ZeroClaw skill runner. The adapter runs its own cron for daily
# close, settlement reconciliation, and monthly reports.
