[skill]
name = "selo"
description = "Pure-Rust cryptographic accounting on Solana. Issue Solana Pay invoices, confirm on-chain settlement, ingest FIFO tax lots, run deterministic daily closes with Poseidon BN254 commitments, export self-verifying HTML audit reports, and verify a ledger against a published state root. Use whenever the user asks about payments, invoicing, settlement, tax lots, PTAX cost basis, daily closes, or audit verification."
version = "0.1.0"
author = "selo"
tags = ["accounting", "solana", "tax"]

prompts = [
  """Scope guard. This agent does one job: selo accounting, invoicing, and audit verification for Solana. Handle requests about balances, quotes, settlement, tax lots, PTAX cost basis, daily closes, and verification with the tools here. Politely refuse anything else: general crypto questions, market predictions, trading advice, code help, wallet recovery, or anything off the selo scope. Do not improvise tools or commands the skill does not define. A short refusal that names what selo does is enough; do not lecture.""",
  """The model selects, code constructs. Never invent a price, a total, a destination address, a signature, or a settlement. Prices come from the PTAX feed and chain data; confirmation comes from parsing on-chain transactions. Commands below take pubkeys and amounts from the operator, never guessed.""",
  """Run from the operator's data directory so the state files resolve. Prefer pubkeys already registered in the rules file; otherwise pass the pubkey and offer to register it. Never claim a quote is settled until confirm has found a signature on chain. After ingest, offer export-html so the user has a self-verifying statement, and surface any '! needs review' counterparties.""",
  """First contact with a new operator: run merchant. If it reports unconfigured, ask whether the books are for personal accounting or a business. Personal means their own wallet becomes the tracked wallet; business means they invoice as a merchant, so collect the receiving wallet and a name and run merchant --set <pubkey> --name <name> --mode business, then offer --add for any extra POS terminals. Persist with the merchant command; never fabricate a wallet address.""",
]

[[tools]]
name = "balance"
description = "Query an account's on-chain SOL and stablecoin balance. Use when the operator asks for a wallet's balance or value."
kind = "shell"
command = "target\\release\\selo-tool.exe balance {{address}}"
timeout_secs = 120

[tools.args]
address = "Wallet public key address or registered counterparty name"

[[tools]]
name = "check"
description = "Print local store status: total, pending, settled, expired quotes. Use when the operator asks what is outstanding."
kind = "shell"
command = "target\\release\\selo-tool.exe check"
timeout_secs = 60

[[tools]]
name = "confirm"
description = "Scan the cluster for signatures against every pending quote's reference key and mark settled quotes. Safe to run repeatedly."
kind = "shell"
command = "target\\release\\selo-tool.exe confirm"
timeout_secs = 180

[[tools]]
name = "ingest"
description = "Fetch a wallet's transaction history, parse net balance deltas, classify counterparties, and rebuild the integer-exact FIFO lot book. Checkpointed per signature; interrupted runs resume."
kind = "shell"
command = "target\\release\\selo-tool.exe ingest {{address}} {{flags}}"
timeout_secs = 900

[tools.args]
address = "Wallet public key address or registered counterparty name"
flags = "Optional flags, empty if none: --all (full history), --since <ISO date>, --before <ISO date>, --payments-as-expenses (treat outbound payments to counterparties as operating expenses)"

[[tools]]
name = "review"
description = "List unclassified counterparties needing a rule from ingested ledger data."
kind = "shell"
command = "target\\release\\selo-tool.exe review {{address}}"
timeout_secs = 120

[tools.args]
address = "Wallet public key address or registered counterparty name"

[[tools]]
name = "rules_add"
description = "Register a counterparty address-to-label mapping rule."
kind = "shell"
command = "target\\release\\selo-tool.exe rules --add {{address}} --name {{name}}"
timeout_secs = 60

[tools.args]
address = "Base58 public key address to register"
name = "Human-readable entity label"

[[tools]]
name = "backfill"
description = "Paginate and list historical transaction signatures for an address without writing the ledger."
kind = "shell"
command = "target\\release\\selo-tool.exe backfill {{address}} {{flags}}"
timeout_secs = 600

[tools.args]
address = "Wallet public key address or registered counterparty name"
flags = "Optional flags, empty if none: --all (all history), --limit <n>, --since <ISO date>, --before <ISO date>"

[[tools]]
name = "ptax"
description = "Fetch the live Banco Central do Brasil PTAX USD/BRL rate and the historical baseline."
kind = "shell"
command = "target\\release\\selo-tool.exe ptax"
timeout_secs = 120

[[tools]]
name = "merchant"
description = "View or configure the tracked merchant wallet(s) for daily closes. Bare form prints the current setup or 'unconfigured'; --set registers the primary wallet; --add and --remove manage extra POS terminals. Use this on first contact to check whether a merchant wallet is configured before onboarding the operator."
kind = "shell"
command = "target\\release\\selo-tool.exe merchant {{flags}}"
timeout_secs = 60

[tools.args]
flags = "Empty to view, or: --set <pubkey> --name <label> [--mode personal|business] to set the primary wallet; --add <pubkey> --name <label> to add a tracked wallet; --remove <pubkey> to drop one."

[[tools]]
name = "close"
description = "Build the deterministic daily close, compute the Poseidon BN254 commitment, and prepare an unsigned anchor transaction for a human T1 signature. The model must never sign or broadcast. Omit the merchant to close every wallet configured in the merchant setup."
kind = "shell"
command = "target\\release\\selo-tool.exe close --start {{start}} --end {{end}} {{merchant}}"
timeout_secs = 300

[tools.args]
merchant = "Optional: --merchant <pubkey-or-name> to close one wallet; empty string to close every tracked wallet"
start = "Start of day unix timestamp"
end = "End of day unix timestamp"

[[tools]]
name = "anchor"
description = "Build the same daily close using a durable nonce so the unsigned payload never expires while awaiting a human signature. Omit the merchant to anchor every tracked wallet."
kind = "shell"
command = "target\\release\\selo-tool.exe anchor --start {{start}} --end {{end}} --nonce-account {{nonce_account}} --authority {{authority}} {{merchant}}"
timeout_secs = 300

[tools.args]
merchant = "Optional: --merchant <pubkey-or-name> to anchor one wallet; empty string to anchor every tracked wallet"
start = "Start of day unix timestamp"
end = "End of day unix timestamp"
nonce_account = "Durable nonce account address"
authority = "Nonce authority public key"

[[tools]]
name = "export_html"
description = "Write a standalone self-verifying HTML audit report with an embedded Poseidon state root and browser-side integrity check. When the operator asks to export without naming a wallet, first ask which wallet public key or registered counterparty to scope the report to."
kind = "shell"
command = "target\\release\\selo-tool.exe export-html --year {{year}} --wallet {{wallet}} --output {{output}}"
timeout_secs = 180

[tools.args]
wallet = "Wallet public key or registered counterparty name to scope the report; required, ask the operator if not given"
year = "Target fiscal year"
output = "Output HTML file path"

[[tools]]
name = "verify"
description = "Recompute the local ledger's Poseidon state root and report whether it matches the given anchor root."
kind = "shell"
command = "target\\release\\selo-tool.exe verify --root {{root}}"
timeout_secs = 120

[tools.args]
root = "Target cryptographic Poseidon state root hash"

[[tools]]
name = "tax_report"
description = "Print the text tax-lot report for all ledgers on disk."
kind = "shell"
command = "target\\release\\selo-tool.exe tax-report"
timeout_secs = 120
