# Selo Telegram Adapter — committed defaults.
# Secrets live in .env (already gitignored). Per-machine overrides go in
# config.local.toml (also gitignored via *.local.toml rule).

[selo]
# Directory where selo-tool runs. Defaults to the repo root so the adapter,
# the CLI, and the ZeroClaw agent share the same .selo_* state files.
# Override with the SELO_DATA_DIR environment variable.
data_dir = ""

[merchant]
# Tracked wallets are read from the persisted merchant config
# (.selo_merchant.json in selo-tool's working directory), set with
# selo-tool merchant --set. SELO_MERCHANT env is a fallback for operators
# who have not adopted the merchant config yet.
pubkey = ""
# Fiscal year for report generation.
year = "2026"
# Timezone for cron schedules (IANA tz name).
timezone = "America/Sao_Paulo"

[schedule]
# Daily close at 23:00 local time.
close = "0 23 * * *"
# Settlement reconciliation interval in seconds.
reconciliation_interval_secs = 60
# Hourly store-health ping.
health = "0 * * * *"
# Monthly full reconciliation on the 1st at 06:00.
monthly_reconciliation = "0 6 1 * *"

[alerts]
# Settlement confirmations push to all alert chat IDs.
# Set TELEGRAM_ALERTS_TO in .env (comma-separated chat IDs).
