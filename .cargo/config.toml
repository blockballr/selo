# Poseidon over BN254 uses large stack frames for field arithmetic, and a
# 32 level merkle proof folds 32 of them. wasm-ld defaults the component
# stack to 1 MiB, which an unoptimised build of that path can exhaust, so
# give it real headroom rather than relying on the optimiser to save it.
[target.wasm32-wasip2]
rustflags = ["-C", "link-arg=-zstack-size=8388608"]
