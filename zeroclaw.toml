# ZeroClaw Selo Integration (ZeroClaw 0.8.4)
#
# Selo runs through ZeroClaw as a skill under the `selo` agent. The agent's
# model brain (Gemini) interprets messages and invokes the selo-tool release
# binary, which owns the money path.
#
# The security model is enforced in two layers:
#   1. The selo agent runs under the `selo-safe` risk profile: it may only
#      run `selo-tool`, and only read/query/close-prep subcommands. The
#      money-moving and mutation commands (issue, refund, expire) are
#      excluded from the agent entirely and stay human-only behind the
#      Telegram adapter's confirm-token gates.
#   2. selo-tool itself never signs: a daily close or anchor produces an
#      unsigned transaction that requires the human T1 signature before
#      broadcast. The agent never holds a key.
#
# The live configuration lives at ~/.zeroclaw/config.toml. This file is the
# canonical reference for the shape of that setup, kept in the repo so the
# agent and skill wiring is reproducible and auditable.

[agents.selo]
name = "SeloAccountingBot"
description = "Cryptographic accounting agent for Solana payment intent, settlement reconciliation, and daily close anchoring"
skill_bundles = ["selo"]
risk_profile = "selo-safe"
model_provider = "gemini.default"

[risk_profiles.selo-safe]
allowed_commands = ["selo-tool"]
allowed_roots = ["C:\\Users\\user\\Desktop\\selo", "C:\\Users\\user\\.zeroclaw\\data"]
always_ask = ["close", "anchor"]

[skill_bundles.selo]
directory = 'C:\Users\user\.zeroclaw\shared\skills\selo'

[channels.telegram.primary]
enabled = true

[channels.whatsapp.primary]
enabled = false

# Provider and bot credentials are secrets set in ~/.zeroclaw/config.toml
# (masked input), never in this file or in version control.
